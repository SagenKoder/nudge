name: Bug report
description: A window went somewhere it should not, or a shortcut does nothing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: Pressed ⌃⌥← twice on a Safari window on my right monitor, it ended up …
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app's window?
      placeholder: Safari 19.1
  - type: textarea
    id: screens
    attributes:
      label: Your screens
      description: How many, and how they are arranged in System Settings → Displays.
  - type: input
    id: versions
    attributes:
      label: Nudge and macOS versions
      description: Open Nudge again from Finder or Spotlight to see its version.
      placeholder: Nudge 1.0.0, macOS 15.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Run `log show --last 5m --info --predicate 'subsystem == "com.sagenkoder.nudge"'` after reproducing.
      render: text
